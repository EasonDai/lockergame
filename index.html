<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f4ead8" />
<title>奶奶的柜子 · 3D 解谜小游戏</title>
<style>
  :root {
    --ink: #3d3030;
    --bg: #f4ead8;
    --paper: #fffaf1;
    --accent: #e07a5f;
    --mint: #7fb7a4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    background: radial-gradient(ellipse at 50% 40%, #fdf6ea 0%, #f4ead8 55%, #ebdcc3 100%);
  }
  canvas { position: fixed; inset: 0; display: block; outline: none; z-index: 1; touch-action: none; }
  button { font: inherit; color: var(--ink); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

  /* 背景装饰 */
  .deco { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; }
  .sun { width: 46vmin; height: 46vmin; left: 50%; top: 46%; transform: translate(-50%, -50%); background: #f6dcc0; }
  .dot1 { width: 70px; height: 70px; right: 12%; top: 20%; background: #f2cc8f; border: 2.5px solid var(--ink); }
  .dot2 { width: 22px; height: 22px; right: 20%; top: 32%; background: #98c1d9; border: 2.5px solid var(--ink); }
  .dot3 { width: 34px; height: 34px; left: 9%; bottom: 18%; background: #f4a6b8; border: 2.5px solid var(--ink); }
  .cloud { position: fixed; pointer-events: none; z-index: 0; left: 8%; top: 22%; width: 120px; height: 36px;
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 30px; }
  .cloud::before { content: ""; position: absolute; width: 52px; height: 52px; left: 22px; top: -30px;
    background: var(--paper); border: 2.5px solid var(--ink); border-bottom-color: transparent; border-radius: 50%; }

  /* UI */
  .ui { position: fixed; z-index: 2; }
  .title { left: 32px; top: 28px; pointer-events: none; }
  .title h1 { font-size: 32px; letter-spacing: 4px; font-weight: 800; }
  .title h1 span { display: inline-block; background: var(--accent); color: var(--paper); padding: 0 10px; margin-left: 6px;
    border: 2.5px solid var(--ink); border-radius: 10px; transform: rotate(-4deg); font-size: 18px; vertical-align: middle; }
  .title p { margin-top: 8px; font-size: 14px; opacity: .75; letter-spacing: 1px; }

  .pill { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 3px 3px 0 var(--ink); }
  .hud { right: 26px; top: 26px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .hudrow { display: flex; gap: 10px; align-items: center; }
  .progress { display: flex; gap: 4px; padding: 6px 12px; }
  .progress span { font-size: 18px; opacity: .22; filter: grayscale(1); transition: opacity .4s, filter .4s, transform .4s; }
  .progress span.on { opacity: 1; filter: none; }
  .timer { padding: 7px 14px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; gap: 10px; }
  .btn { font-size: 14px; font-weight: 700; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; white-space: nowrap; box-shadow: 3px 3px 0 var(--ink);
    transition: transform .12s, box-shadow .12s, background .2s; }
  .btn:hover { background: #fde8d7; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--accent); color: var(--paper); }
  .btn.primary:hover { background: #e98a70; }
  .btn:disabled { opacity: .45; pointer-events: none; }

  #tip { position: fixed; z-index: 3; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px;
    padding: 5px 10px; border-radius: 8px; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; white-space: nowrap; }
  #tip.show { opacity: 1; transform: translateY(0); }

  #card { left: 32px; bottom: 26px; width: 300px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 16px;
    padding: 14px 16px 16px; box-shadow: 4px 4px 0 var(--ink); opacity: 0; transform: translateY(16px) rotate(-1deg);
    transition: opacity .25s, transform .3s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
  #card.show { opacity: 1; transform: translateY(0) rotate(-1deg); }
  #card .tag { display: inline-block; font-size: 11px; font-weight: 700; background: var(--mint); color: var(--paper);
    border: 2px solid var(--ink); border-radius: 6px; padding: 1px 7px; margin-bottom: 6px; }
  #card .tag.hint { background: #f2c14e; color: var(--ink); }
  #card h3 { font-size: 17px; margin-bottom: 4px; }
  #card p { font-size: 13.5px; line-height: 1.65; opacity: .88; }

  #bubble { position: fixed; z-index: 3; pointer-events: none; background: var(--paper); border: 2.5px solid var(--ink);
    border-radius: 14px; padding: 4px 12px; font-weight: 800; font-size: 16px; transform: translate(-50%, -100%) scale(0);
    transform-origin: 50% 120%; transition: transform .25s cubic-bezier(.3,1.8,.5,1); white-space: nowrap; }
  #bubble.show { transform: translate(-50%, -100%) scale(1); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; background: var(--paper);
    border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }

  #toast { left: 50%; top: 26px; transform: translate(-50%, -20px); background: var(--accent); color: var(--paper);
    border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 20px; font-weight: 800; box-shadow: 4px 4px 0 var(--ink);
    opacity: 0; transition: opacity .3s, transform .4s cubic-bezier(.3,1.6,.5,1); pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 背包 */
  #inv { left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px; padding: 8px 12px; box-shadow: 4px 4px 0 var(--ink); }
  #inv .lbl { font-size: 12px; font-weight: 800; writing-mode: vertical-rl; letter-spacing: 2px; opacity: .6; }
  .slot { width: 52px; height: 52px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; font-size: 27px;
    display: grid; place-items: center; cursor: pointer; transition: transform .15s, background .2s, box-shadow .15s; position: relative; }
  .slot:hover { transform: translateY(-3px); }
  .slot.sel { background: #fde8d7; border-color: var(--accent); box-shadow: 0 0 0 3px #f7c3b3; transform: translateY(-5px); }
  .slot.empty { border-style: dashed; opacity: .35; cursor: default; background: transparent; }
  .slot.empty:hover { transform: none; }
  .slot .nm { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700;
    white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .slot:hover .nm, .slot.sel .nm { opacity: .8; }
  #cursorItem { position: fixed; z-index: 4; pointer-events: none; font-size: 30px; transform: translate(6px, 6px); display: none;
    filter: drop-shadow(2px 2px 0 var(--paper)); }

  /* 弹窗 */
  #modal { position: fixed; inset: 0; z-index: 6; background: rgba(61, 48, 48, .38); display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity .25s; }
  #modal.show { opacity: 1; pointer-events: auto; }
  #sheet { position: relative; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink);
    padding: 22px 24px 22px; width: min(440px, 92vw); max-height: 92vh; overflow: auto; text-align: center;
    transform: scale(.9) rotate(-1deg); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
  #modal.show #sheet { transform: scale(1) rotate(0); }
  #sheet h2 { font-size: 20px; margin-bottom: 6px; letter-spacing: 1px; }
  #sheet .sub { font-size: 13px; opacity: .7; margin-bottom: 14px; line-height: 1.6; }
  #sheet .x { position: absolute; right: 12px; top: 10px; width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--ink);
    background: var(--paper); cursor: pointer; font-weight: 800; }
  #sheet .x:hover { background: #fde8d7; }
  #sheet .msg { min-height: 22px; margin-top: 10px; font-size: 13.5px; font-weight: 700; color: var(--accent); }
  #sheet .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .shake { animation: shake .45s; }
  @keyframes shake { 0%,100% { translate: 0 } 20% { translate: -10px } 40% { translate: 9px } 60% { translate: -6px } 80% { translate: 4px } }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.35) } 100% { transform: scale(1) } }

  .letter { text-align: left; background: repeating-linear-gradient(#fffaf1 0 29px, #ecdcc4 29px 30px); border: 2px dashed #d8c3a3;
    border-radius: 12px; padding: 14px 18px; line-height: 30px; font-size: 15px; margin: 10px 0 6px; }
  .letter .sign { text-align: right; }
  .letter em { font-style: normal; background: #fde8d7; border-radius: 4px; padding: 0 3px; }

  .clockface { width: 230px; height: 230px; display: block; margin: 4px auto 6px; }
  .ctrl { display: grid; grid-template-columns: auto auto auto; gap: 8px 10px; align-items: center; justify-content: center; margin-top: 4px; }
  .ctrl span { font-weight: 800; font-size: 14px; }
  .ctrl .btn { padding: 6px 14px; }

  .shelfsvg { width: 100%; max-width: 380px; display: block; margin: 4px auto; }
  .shelfsvg .spine { cursor: pointer; }
  .shelfsvg .spine:hover rect.cv { stroke: var(--accent); }
  .bookinfo { min-height: 64px; font-size: 13.5px; line-height: 1.7; background: #f6eddd; border-radius: 12px; padding: 8px 12px; margin-top: 8px; }
  .bookinfo b { display: block; }

  .wheels { display: flex; justify-content: center; gap: 10px; margin: 8px 0 14px; }
  .wheel { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .wheel button { width: 46px; height: 30px; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; cursor: pointer; font-size: 12px; }
  .wheel button:hover { background: #fde8d7; }
  .wheel .num { width: 54px; height: 64px; border: 2.5px solid var(--ink); border-radius: 12px; background: #3d5a80; color: #fff;
    font-size: 34px; font-weight: 800; display: grid; place-items: center; box-shadow: inset 0 -8px 0 rgba(0,0,0,.18); font-variant-numeric: tabular-nums; }

  .radio { background: #f2cc8f; border: 2.5px solid var(--ink); border-radius: 16px; padding: 12px 16px; margin: 6px 0 12px; }
  .radio .fq { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .radio .fq small { font-size: 14px; margin-left: 4px; }
  .bars { display: flex; gap: 4px; justify-content: center; align-items: flex-end; height: 26px; margin-top: 4px; }
  .bars i { width: 9px; border: 2px solid var(--ink); border-radius: 3px; background: #fff; transition: background .15s; }
  .bars i.on { background: #81b29a; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; cursor: pointer; }
  .tune-row { display: flex; gap: 8px; align-items: center; }
  .tune-row input { flex: 1; }
  .btn.small { padding: 4px 10px; min-width: 0; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; opacity: .6; margin-top: -2px; }
  .broadcast { min-height: 48px; margin-top: 12px; font-size: 14px; line-height: 1.7; font-weight: 700; }
  .notes { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .notes i { width: 18px; height: 18px; border: 2.5px solid var(--ink); border-radius: 50%; opacity: .18; transition: opacity .15s; }
  .notes i.long { width: 30px; border-radius: 10px; }
  .notes i.gap { margin-right: 10px; }
  .notes i.on { opacity: 1; animation: pop .3s; }

  .slots7 { display: flex; gap: 6px; justify-content: center; margin: 4px 0 16px; }
  .slots7 i { width: 30px; height: 30px; border: 2.5px dashed var(--ink); border-radius: 50%; opacity: .5; }
  .slots7 i.f { border-style: solid; opacity: 1; animation: pop .25s; }
  .xylo { display: flex; gap: 6px; justify-content: center; align-items: center; }
  .xylo button { width: 46px; border: 2.5px solid var(--ink); border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 12px;
    color: var(--ink); box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .xylo button:active, .xylo button.hit { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

  .photo { width: 100%; max-width: 330px; display: block; margin: 6px auto 4px; transform: rotate(-2deg); }
  .stats { display: flex; justify-content: center; gap: 10px; margin: 12px 0 4px; flex-wrap: wrap; }
  .stats div { background: #f6eddd; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 12px; font-size: 13px; }
  .stats b { display: block; font-size: 17px; }

  #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; font-weight: 700; letter-spacing: 2px;
    background: var(--bg); transition: opacity .5s; }
  #loading.hide { opacity: 0; pointer-events: none; }

  /* ---------- 手机竖屏 ---------- */
  @media (max-width: 640px) {
    .title { left: 14px; top: calc(12px + env(safe-area-inset-top)); }
    .title h1 { font-size: 21px; letter-spacing: 2px; }
    .title h1 span { font-size: 13px; padding: 0 7px; }
    .title p { display: none; }
    .hud { left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); gap: 8px; }
    .hudrow { display: contents; }
    .hud { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: ". shards time" "prog prog prog" "tools tools tools"; align-items: center; }
    #shards { grid-area: shards; }
    .hudrow .timer:last-child { grid-area: time; }
    .progress { grid-area: prog; justify-self: center; padding: 3px 10px; gap: 3px; box-shadow: 2px 2px 0 var(--ink); }
    .progress span { font-size: 14px; }
    .timer { padding: 4px 10px; font-size: 13px; box-shadow: 2px 2px 0 var(--ink); }
    .toolbar { grid-area: tools; justify-self: center; gap: 8px; }
    .toolbar .btn { width: 42px; height: 42px; padding: 0; font-size: 17px; display: grid; place-items: center; box-shadow: 2px 2px 0 var(--ink); }
    .btn { padding: 7px 12px; font-size: 13px; }
    .toolbar .t { display: none; }
    #card { left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); width: calc(100vw - 24px); padding: 10px 14px 12px;
      transform: translate(-50%, 16px); }
    #card.show { transform: translate(-50%, 0); }
    #card h3 { font-size: 15px; }
    #card p { font-size: 13px; line-height: 1.55; }
    #inv { bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100vw - 20px); gap: 7px; padding: 7px 9px; overflow-x: auto; }
    #inv .lbl { display: none; }
    .slot { width: 46px; height: 46px; font-size: 23px; flex: none; }
    .slot .nm { display: none; }
    #toast { top: calc(150px + env(safe-area-inset-top)); bottom: auto; font-size: 14px; padding: 8px 14px; max-width: 92vw; white-space: normal; text-align: center; }
    #sheet { width: 94vw; padding: 18px 14px 16px; max-height: 86dvh; border-radius: 18px; }
    #sheet h2 { font-size: 18px; padding: 0 30px; }
    .letter { padding: 10px 12px; font-size: 14px; }
    .xylo { gap: 4px; }
    .xylo button { width: 37px; font-size: 11px; }
    .wheel .num { width: 48px; height: 58px; font-size: 30px; }
    .wheel button { width: 44px; height: 36px; }
    .clockface { width: 210px; height: 210px; }
    .ctrl .btn { padding: 8px 14px; }
    .radio .fq { font-size: 30px; }
    .tune-row .btn.small { width: 40px; height: 40px; padding: 0; }
    .dot1 { width: 44px; height: 44px; top: 30%; }
    .cloud { top: 30%; transform: scale(.7); transform-origin: left top; }
  }
  /* 手机横屏（矮屏） */
  @media (max-height: 500px) and (orientation: landscape) {
    .title { left: 14px; top: 10px; }
    .title h1 { font-size: 20px; }
    .title p { display: none; }
    .hud { right: 12px; top: 10px; gap: 6px; }
    .progress span { font-size: 14px; }
    .timer { padding: 4px 10px; font-size: 13px; }
    .toolbar { gap: 6px; }
    .toolbar .btn { padding: 6px 10px; }
    .toolbar .t { display: none; }
    #card { left: 12px; bottom: 12px; width: 280px; padding: 10px 14px; }
    #inv { left: auto; right: 12px; bottom: 12px; transform: none; }
    #inv .lbl { display: none; }
    .slot { width: 42px; height: 42px; font-size: 21px; }
    #sheet { max-height: 92dvh; padding: 14px 18px; }
  }
  /* 触屏：没有鼠标悬停，不显示跟随光标的道具和提示 */
  @media (hover: none) {
    #cursorItem, #tip { display: none !important; }
    .slot:hover { transform: none; }
    .btn:hover { background: var(--paper); }
    .btn.primary:hover { background: var(--accent); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div class="deco sun"></div>
  <div class="deco dot1"></div>
  <div class="deco dot2"></div>
  <div class="deco dot3"></div>
  <div class="cloud"></div>

  <header class="ui title">
    <h1>奶奶的柜子<span>解谜</span></h1>
    <p>拖动旋转 · 滚轮缩放 · 点击调查 · 选中道具再点目标来使用</p>
  </header>
  <div class="ui hud">
    <div class="hudrow">
      <div class="pill timer" id="shards" title="隐藏的照片碎片">🧩 0/3</div>
      <div class="pill progress" id="progress"></div>
      <div class="pill timer">⏱ <span id="time">00:00</span></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="btnHint">💡<span class="t"> 提示</span></button>
      <button class="btn" id="btnView">🎯<span class="t"> 视角</span></button>
      <button class="btn" id="btnMusic">🎵<span class="t"> 音乐</span></button>
      <button class="btn" id="btnSound">🔊<span class="t"> 声音</span></button>
      <button class="btn" id="btnReset">↻<span class="t"> 重来</span></button>
    </div>
  </div>
  <div id="tip"></div>
  <div class="ui" id="card"><div class="tag"></div><h3></h3><p></p></div>
  <div id="bubble">喵～</div>
  <div class="ui" id="toast"></div>
  <div class="ui" id="inv"></div>
  <div id="cursorItem"></div>
  <div id="modal"><div id="sheet"></div></div>
  <div id="loading">柜子搬运中…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
 * 基础场景
 * ======================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
const IS_TOUCH = matchMedia('(hover: none)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
const HOME = new THREE.Vector3(3.2, 5.9, 11.2);
const TARGET = new THREE.Vector3(0, 1.85, 0.2);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 17;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.rotateSpeed = IS_TOUCH ? 0.8 : 1;

scene.add(new THREE.HemisphereLight('#fff6e8', '#d9c3a5', 2.1));
const sun = new THREE.DirectionalLight('#fff3df', 2.3);
sun.position.set(4, 9, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 6, bottom: -4, near: 1, far: 25 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun);

/* =========================================================
 * 插画风材质：三阶色调 + 描边
 * ======================================================= */
const gradient = new THREE.DataTexture(new Uint8Array([0, 0, 170, 255]), 4, 1, THREE.RedFormat); // 背光面为 0，避免灯光透过柜门
gradient.minFilter = gradient.magFilter = THREE.NearestFilter;
gradient.needsUpdate = true;

const matCache = {};
function mat(color, unique = false, extra = {}) {
  if (!unique && matCache[color]) return matCache[color];
  const m = new THREE.MeshToonMaterial({ color, gradientMap: gradient, ...extra });
  if (!unique) matCache[color] = m;
  return m;
}

const INK = '#3d3030';
const HILITE = '#ff6b4a';
const LINE = 0.016, LINE_HOVER = 0.03;
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { thickness: { value: LINE }, color: { value: new THREE.Color(INK) } },
  vertexShader: /* glsl */`
    uniform float thickness;
    void main() {
      vec3 p = position + normal * thickness;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 color;
    void main() {
      gl_FragColor = vec4(color, 1.0);
      #include <colorspace_fragment>
    }`,
  side: THREE.BackSide,
});

// 描边用平滑法线（合并顶点），避免盒子/圆柱边角处描边断开
const outlineGeoCache = new WeakMap();
function outlineGeo(geo) {
  let g = outlineGeoCache.get(geo);
  if (!g) {
    g = geo.clone();
    for (const k of Object.keys(g.attributes)) if (k !== 'position') g.deleteAttribute(k);
    g = mergeVertices(g);
    g.computeVertexNormals();
    outlineGeoCache.set(geo, g);
  }
  return g;
}

function M(geo, color, { outline = true, shadow = true, material } = {}) {
  const mesh = new THREE.Mesh(geo, material || mat(color));
  mesh.castShadow = shadow;
  mesh.receiveShadow = true;
  if (outline) {
    const o = new THREE.Mesh(outlineGeo(geo), outlineMat);
    o.userData.isOutline = true;
    o.raycast = () => {};
    mesh.add(o);
  }
  return mesh;
}
function place(parent, obj, x = 0, y = 0, z = 0) {
  obj.position.set(x, y, z);
  parent.add(obj);
  return obj;
}
const rbox = (w, h, d, r = 0.03) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, Math.min(w, h, d) / 2 - 0.002));
const cyl = (rt, rb, h, s = 24) => new THREE.CylinderGeometry(rt, rb, h, s);
const sph = (r, ws = 20, hs = 14) => new THREE.SphereGeometry(r, ws, hs);

/* =========================================================
 * 补间动画
 * ======================================================= */
const ease = {
  linear: t => t,
  inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  bounce: t => {
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1 / d1) return n1 * t * t;
    if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
    if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
    return n1 * (t -= 2.625 / d1) * t + 0.984375;
  },
};
let tweens = [];
function tween(duration, onUpdate, { ease: e = ease.inOut, delay = 0, id, onDone } = {}) {
  if (id) tweens = tweens.filter(t => t.id !== id);
  const tw = { t: -delay, duration, onUpdate, e, id, onDone };
  tweens.push(tw);
  return tw;
}
function sequence(steps, done) {
  let i = 0;
  const next = () => {
    if (i >= steps.length) return done?.();
    const s = steps[i++];
    tween(s.d, s.f || (() => {}), { ease: s.e || ease.inOut, delay: s.delay || 0, onDone: next });
  };
  next();
}
function updateTweens(dt) {
  for (const tw of [...tweens]) {
    if (!tweens.includes(tw)) continue;
    tw.t += dt;
    if (tw.t < 0) continue;
    const p = Math.min(tw.t / tw.duration, 1);
    tw.onUpdate(tw.e(p), p);
    if (p >= 1) {
      const i = tweens.indexOf(tw);
      if (i >= 0) tweens.splice(i, 1);
      tw.onDone?.();
    }
  }
}

/* =========================================================
 * 特效：音符 / Zzz / 蒸汽（带描边的小贴片）
 * ======================================================= */
const fxs = [];
function addFx(obj, life, update) { obj.raycast = () => {}; scene.add(obj); fxs.push({ obj, life, age: 0, update }); }
function updateFx(dt) {
  for (let i = fxs.length - 1; i >= 0; i--) {
    const f = fxs[i];
    f.age += dt;
    const p = Math.min(f.age / f.life, 1);
    f.update(p, f.obj);
    if (p >= 1) { scene.remove(f.obj); f.obj.material.dispose(); fxs.splice(i, 1); }
  }
}
const texCache = {};
function canvasTex(key, draw) {
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return (texCache[key] = t);
}
const textTex = (ch, color) => canvasTex('t' + ch + color, ctx => {
  ctx.font = 'bold 92px "PingFang SC", "Hiragino Sans GB", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 12; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  ctx.strokeText(ch, 64, 68); ctx.fillStyle = color; ctx.fillText(ch, 64, 68);
});
const puffTex = () => canvasTex('puff', ctx => {
  ctx.beginPath(); ctx.arc(64, 64, 52, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
});
const fade = p => (p < 0.15 ? p / 0.15 : 1 - Math.max(0, (p - 0.55) / 0.45));

function spawnText(ch, color, pos, { size = 0.26, rise = 0.9, drift = 0.4, life = 1.7 } = {}) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTex(ch, color), transparent: true, depthWrite: false }));
  const start = pos.clone(), dx = (Math.random() - 0.5) * drift, ph = Math.random() * 6;
  sp.position.copy(start);
  addFx(sp, life, (p, o) => {
    o.position.set(start.x + dx * p + Math.sin(p * 7 + ph) * 0.05, start.y + rise * ease.out(p), start.z);
    o.material.opacity = fade(p);
    o.material.rotation = Math.sin(p * 6 + ph) * 0.3;
    o.scale.setScalar(size * (0.5 + 0.5 * Math.min(1, p * 5)));
  });
}
function spawnPuff(pos, delay = 0) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex(), transparent: true, depthWrite: false, opacity: 0 }));
  const start = pos.clone(), dx = (Math.random() - 0.5) * 0.15;
  sp.position.copy(start); sp.scale.setScalar(0.001);
  setTimeout(() => addFx(sp, 1.6, (p, o) => {
    o.position.set(start.x + dx * p + Math.sin(p * 8) * 0.03, start.y + 0.65 * ease.out(p), start.z);
    o.material.opacity = fade(p) * 0.95;
    o.scale.setScalar(0.06 + 0.14 * p);
  }), delay * 1000);
}

/* =========================================================
 * 声音（WebAudio 合成，无需外部文件）
 * ======================================================= */
let actx = null, muted = false;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur = 0.2, { type = 'sine', vol = 0.15, when = 0, slideTo } = {}) {
  if (muted) return;
  const a = audio(), t = a.currentTime + Math.max(0, when);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function meow() {
  if (muted) return;
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(520, t);
  o.frequency.exponentialRampToValueAtTime(900, t + 0.18);
  o.frequency.exponentialRampToValueAtTime(470, t + 0.6);
  f.type = 'bandpass'; f.Q.value = 3;
  f.frequency.setValueAtTime(1200, t);
  f.frequency.linearRampToValueAtTime(1900, t + 0.2);
  f.frequency.linearRampToValueAtTime(900, t + 0.6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3, t + 0.06);
  g.gain.setValueAtTime(0.3, t + 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
  o.connect(f).connect(g).connect(a.destination);
  o.start(t); o.stop(t + 0.7);
}

const interactives = [];
function register(obj, info) {
  obj.userData.info = info;
  info.outlines = [];
  obj.traverse(c => {
    if (c.userData.isOutline && !c.userData.claimed) {
      c.material = c.material.clone(); // 每个可交互物体独立描边，用于悬停高亮
      c.userData.claimed = true;
      info.outlines.push(c.material);
    }
  });
  interactives.push(obj);
}

const doodleTex = (() => {

})();
const doodleMat = new THREE.ShaderMaterial({
  uniforms: { map: { value: doodleTex }, depthMap: { value: projRT.depthTexture }, vp: { value: projVP }, glow: { value: 0 }, time: { value: 0 }, alpha: { value: 0 } },
  transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2,
  vertexShader: /* glsl */`
    uniform mat4 vp;
    varying vec4 vProj;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vProj = vp * wp;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D map; uniform sampler2D depthMap; uniform float glow; uniform float time; uniform float alpha;
    varying vec4 vProj;
    void main() {
      if (alpha < 0.01 || vProj.w <= 0.0) discard;
      vec2 uv = vProj.xy / vProj.w * 0.5 + 0.5;
      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) discard;
      if (vProj.z / vProj.w * 0.5 + 0.5 > texture2D(depthMap, uv).x + 0.0004) discard;
      vec4 c = texture2D(map, uv);
      if (c.a < 0.5) discard;
      vec3 col = mix(c.rgb, vec3(1.0, 0.95, 0.7), glow * (0.35 + 0.15 * sin(time * 4.0)));
      gl_FragColor = vec4(col, 0.92 * alpha);
      #include <colorspace_fragment>
    }`,
});

const inv = $('#inv'), cursorItem = $('#cursorItem');
let selected = null;
function updateInv() {
  if (selected && !ITEMS[selected].has()) select(null);
  const held = Object.keys(ITEMS).filter(k => ITEMS[k].has());
  let html = '<span class="lbl">背包</span>';
  for (let i = 0; i < Math.max(5, held.length); i++) {
    const k = held[i];
    html += k
      ? `<div class="slot${selected === k ? ' sel' : ''}" data-k="${k}">${ITEMS[k].icon}<span class="nm">${ITEMS[k].name}</span></div>`
      : '<div class="slot empty"></div>';
  }
  inv.innerHTML = html;
}
function select(k) {
  selected = k;
  cursorItem.textContent = k ? ITEMS[k].icon : '';
  cursorItem.style.display = k ? 'block' : 'none';
  inv.querySelectorAll('.slot').forEach(s => s.classList.toggle('sel', s.dataset.k === k));
  if (hovered) tipEl.textContent = tipText(hovered.userData.info);

  if (selected && selected !== 'letter' && selected !== 'note' && k !== 'letter' && k !== 'note') return tryCombine(selected, k);
  if (k === 'letter') return openLetter();
  if (k === 'note') return openNote();

  say(ITEMS[k].icon + ' ' + ITEMS[k].name, (ITEMS[k].desc ? ITEMS[k].desc + ' ' : '') + '已拿在手上。点场景里的东西使用它，或点背包里另一样东西试试组合（' + (matchMedia('(hover: none)').matches ? '再点一下它可以放下' : 'Esc 放下') + '）。');

function stage() {
  if (!S.gotKey) return 'clock';
  if (!S.doorsUnlocked) return 'door';
  if (!S.gotBulb && !S.lampFixed) return 'bulb';
  if (!S.lampFixed) return 'lamp';
  if (!S.drawerUnlocked) return 'drawer';
  if (!S.radioTuned) {
    if (!S.gotYarn) return 'yarn';
    if (!S.gotNoteB) {
      if (S.gotLine) return 'fish2';
      return S.gotMagnet || S.hintLv.mailbox ? 'combine' : 'mailbox';

    if (!S.sawFreq) return 'view';
    return 'radio';
  }

}

const modal = $('#modal'), sheet = $('#sheet');
let modalClose = null;
function openModal(html, onClose) {
  if (modal.classList.contains('show')) closeModal();
  sheet.innerHTML = html + '<button class="x" title="关闭">✕</button>';

function closeModal() {
  if (!modal.classList.contains('show')) return;
  modal.classList.remove('show');

}
modal.addEventListener('pointerdown', e => { if (e.target === modal) closeModal(); });

/* ---------- 闹钟特写 ---------- */
function clockSVG(h, m) {
  let s = '<svg viewBox="-110 -110 220 220" class="clockface">';
  s += '<circle r="104" fill="#b56576" stroke="#3d3030" stroke-width="5"/><circle r="86" fill="#fffaf1" stroke="#3d3030" stroke-width="4"/>';
  for (let i = 1; i <= 12; i++) {
    const a = (i / 12) * Math.PI * 2, x = Math.sin(a) * 66, y = -Math.cos(a) * 66;
    s += CLOCK_ICONS[i]
      ? `<text x="${x}" y="${y + 8}" font-size="23" text-anchor="middle">${CLOCK_ICONS[i]}</text>`
      : `<circle cx="${x}" cy="${y}" r="${i % 3 === 0 ? 5 : 3.5}" fill="#3d3030"/>`;
  }
  s += `<g transform="rotate(${(h % 12) * 30})"><rect x="-5" y="-44" width="10" height="52" rx="5" fill="#3d3030"/></g>`;
  s += `<g transform="rotate(${m * 6})"><rect x="-3.5" y="-70" width="7" height="78" rx="3.5" fill="#e05a47" stroke="#3d3030" stroke-width="2"/></g>`;
  s += '<circle r="8" fill="#f2c14e" stroke="#3d3030" stroke-width="3"/></svg>';
  return s;
}
function openClockModal() {
  const s = openModal(`
    <h2>⏰ 停走的小闹钟</h2>
    <p class="sub">表盘上没有数字，只画着几个小图案。<br>背面有个小锁扣，像是在等某个特定的时间。</p>
    <div id="face"></div>
    <div class="ctrl">
      <button class="btn" data-a="h-">◀</button><span>短针 · 时</span><button class="btn" data-a="h+">▶</button>
      <button class="btn" data-a="m-">◀</button><span>长针 · 分</span><button class="btn" data-a="m+">▶</button>
    </div>
    <div class="row"><button class="btn primary" id="ok">拨好了</button></div>
    <div class="msg"></div>
  `);
  const face = s.querySelector('#face'), msg = s.querySelector('.msg');
  const draw = () => (face.innerHTML = clockSVG(clockState.h, clockState.m));
  draw();
  s.querySelectorAll('[data-a]').forEach(b => (b.onclick = () => {
    const a = b.dataset.a;

    tone(1400, 0.03, { type: 'square', vol: 0.04 });

  s.querySelector('#ok').onclick = () => {

      setTimeout(() => {
        gainItem('key');

      }, 900);
    } else {
      shake(sheet);
      wrong();
      msg.textContent = ['……闹钟一动不动。', '嗒。没有反应。', '好像不是这个时间。'][Math.floor(Math.random() * 3)];
    }
  };

/* ---------- 收音机 ---------- */
let noise = null;
function startNoise() {
  if (muted || noise) return;
  const a = audio();
  const buf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; src.loop = true;
  f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.6;
  g.gain.value = 0;
  src.connect(f).connect(g).connect(a.destination);
  src.start();
  noise = { src, g };
}
function setNoise(v) { if (noise) noise.g.gain.setTargetAtTime(v, audio().currentTime, 0.04); }
function stopNoise() { if (noise) { noise.src.stop(); noise = null; } }
function openRadioModal() {
  const tuned = S.radioTuned;
  let gap = 0;
  const dots = melody.map(([f, d], i) => `<i class="${d > 1 ? 'long' : ''}${i === 6 ? ' gap' : ''}" style="background:${noteOf(f).c}"></i>`).join('');
  const s = openModal(`
    <h2>📻 复古收音机</h2>
    <p class="sub">${tuned ? '「奶奶电台」还在轻轻地播着。' : '调到想听的频率，再按「锁定」。奶奶的电台信号很弱，不锁定是听不清的。'}</p>
    <div class="radio">
      <div class="fq"><span id="fq">${radioState.freq.toFixed(1)}</span><small>MHz</small></div>
      <div class="bars">${[0, 1, 2, 3, 4].map(i => `<i style="height:${8 + i * 4}px"></i>`).join('')}</div>
    </div>
    <div class="tune-row">
      <button class="btn small" id="fdn" ${tuned ? 'disabled' : ''}>◀</button>
      <input type="range" id="fr" min="${FM_MIN * 10}" max="${FM_MAX * 10}" step="1" value="${Math.round(radioState.freq * 10)}" ${tuned ? 'disabled' : ''}>
      <button class="btn small" id="fup" ${tuned ? 'disabled' : ''}>▶</button>
    </div>
    <div class="scale"><span>87.5</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div>
    <div class="row" ${tuned ? 'style="display:none"' : ''}><button class="btn primary" id="fok">📡 锁定这个频率</button></div>
    <div class="broadcast" id="bc"></div>
    <div class="notes" id="notes">${dots}</div>
    <div class="row"><button class="btn" id="replay" ${tuned ? '' : 'hidden'}>▶ 再听一遍</button></div>
  `, () => { stopNoise(); if (music.on === 'radio') stopMusic(); });
  const fq = s.querySelector('#fq'), bars = s.querySelectorAll('.bars i'), fr = s.querySelector('#fr');
  const bc = s.querySelector('#bc'), noteEls = s.querySelectorAll('#notes i'), replay = s.querySelector('#replay');
  const BROADCAST = '「滋……这里是奶奶电台。小家伙，今天的点心，藏在<b>会转的世界</b>里哦。给你唱首睡前歌吧——」';
  const FAKE = [
    { f: 88.6, t: '「……天气预报：明天晴，适合晒被子、晒猫。」' },
    { f: 93.1, t: '「……今日幸运数字是：4、0、3、1！祝您好运——」' },
    { f: 97.4, t: '「……现在是北京时间，下午三点整。嘟——」' },
    { f: 104.8, t: '「……生活小妙招：小鱼干要晒足三天才好吃哦。」' },
  ];
  const update = () => {
    const f = radioState.freq;
    const fake = FAKE.find(x => Math.abs(f - x.f) <= 0.2);
    // 奶奶电台信号太弱：滑动时和别处一样只有杂音，只有假电台会有信号
    const st = fake ? 1 - Math.abs(f - fake.f) / 0.25 : 0;
    const n = S.radioTuned ? 5 : Math.ceil(st * 5 - 0.001);
    bars.forEach((b, i) => b.classList.toggle('on', i < n));
    fq.textContent = f.toFixed(1);
    setNoise(S.radioTuned ? 0 : 0.035 + 0.09 * (1 - st));
    if (!S.radioTuned) bc.innerHTML = fake ? fake.t : '';
  };
  const sing = () => {
    noteEls.forEach(e => e.classList.remove('on'));
    replay.disabled = true;
    playMelody('radio', {
      onNote: i => noteEls[i].classList.add('on'),
      onEnd: () => (replay.disabled = false),
    });
  };
  replay.onclick = sing;
  if (tuned) {
    bc.innerHTML = BROADCAST;
    update();
    return;
  }
  startNoise();
  update();
  const fdn = s.querySelector('#fdn'), fup = s.querySelector('#fup'), fok = s.querySelector('#fok');
  const setF = v => { fr.value = Math.max(FM_MIN * 10, Math.min(FM_MAX * 10, v)); radioState.freq = fr.value / 10; update(); };
  fr.oninput = () => setF(+fr.value);
  fdn.onclick = () => setF(+fr.value - 1);
  fup.onclick = () => setF(+fr.value + 1);
  fok.onclick = () => {
    const f = Math.round(radioState.freq * 10);
    if (f === FM_TARGET * 10) {
      radioState.freq = FM_TARGET;
      fr.disabled = fdn.disabled = fup.disabled = true;
      fok.parentElement.style.display = 'none';
      setFlag('radioTuned');
      stopNoise();
      update();
      sfx.sparkle();
      bc.innerHTML = BROADCAST;
      replay.hidden = false;
      setTimeout(sing, 1500);
      return;
    }
    const fake = FAKE.find(x => Math.abs(radioState.freq - x.f) <= 0.2);
    s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
    tone(180, 0.25, { type: 'square', vol: 0.05 });
    bc.innerHTML = fake
      ? '<span style="opacity:.7">（锁定了……可这只是个普通电台，不是奶奶的声音。）</span>'
      : '<span style="opacity:.7">（锁定了……除了沙沙声，什么也没有。）</span>';
  };
}

    !S.shards.clock && tear(214, 24, 60, 52),

  ].filter(Boolean).join('');

  return `<svg viewBox="0 0 300 210" class="photo">

    <rect x="4" y="4" width="292" height="202" rx="10" fill="#fffaf1" stroke="#3d3030" stroke-width="4"/>
    <g clip-path="url(#pc)">

      <rect x="18" y="140" width="264" height="30" fill="#7fb7a4"/>
      <ellipse cx="92" cy="168" rx="40" ry="46" fill="#b56576" stroke="#3d3030" stroke-width="3"/>

      <circle cx="92" cy="66" r="12" fill="#e6e0da" stroke="#3d3030" stroke-width="3"/>

      <circle cx="84" cy="96" r="6" fill="none" stroke="#3d3030" stroke-width="2.5"/><circle cx="100" cy="96" r="6" fill="none" stroke="#3d3030" stroke-width="2.5"/>
      <path d="M85 106 q7 6 14 0" fill="none" stroke="#3d3030" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="160" cy="170" rx="28" ry="34" fill="#98c1d9" stroke="#3d3030" stroke-width="3"/>
      <circle cx="160" cy="116" r="19" fill="#fde3cf" stroke="#3d3030" stroke-width="3"/>
      <path d="M141 113 q19 -24 38 0 q-8 -8 -19 -6 q-11 -2 -19 6z" fill="#5b4636" stroke="#3d3030" stroke-width="3"/>
      <circle cx="153" cy="118" r="2.5" fill="#3d3030"/><circle cx="167" cy="118" r="2.5" fill="#3d3030"/>
      <path d="M154 126 q6 5 12 0" fill="none" stroke="#3d3030" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="220" cy="156" rx="30" ry="17" fill="#f0a35e" stroke="#3d3030" stroke-width="3"/>
      <path d="M232 128 l4 -14 l8 10 l8 -10 l4 14z" fill="#f0a35e" stroke="#3d3030" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="244" cy="138" r="15" fill="#f0a35e" stroke="#3d3030" stroke-width="3"/>
      <path d="M237 137 q3 -3 6 0 M247 137 q3 -3 6 0" fill="none" stroke="#3d3030" stroke-width="2.5" stroke-linecap="round"/>
      <text x="128" y="62" font-size="18">♥</text><text x="196" y="96" font-size="14">♪</text>
      ${holes}
    </g>
    <rect x="18" y="18" width="264" height="150" rx="6" fill="none" stroke="#3d3030" stroke-width="3"/>
    <text x="150" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#3d3030">${full ? '全家福 · 永远在一起' : '我们 · 和团子'}</text>
  </svg>`;
}
function showEnding() {
  const stars = S.hints === 0 ? '★★★' : S.hints <= 4 ? '★★☆' : '★☆☆';
  const nShard = Object.values(S.shards).filter(Boolean).length, full = nShard === 3;
  const s = openModal(`
    <h2>${full ? '🌈 真结局 · 完整的照片' : '🎁 你找到了奶奶的礼物'}</h2>
    ${photoSVG(full)}
    <div class="letter" style="font-size:14px">
      小家伙，你找到啦！<br>
      这首《小星星》，是你小时候每晚都要听着才肯睡的歌。<br>
      照片里是我们俩和团子的第一张合影。<br>
      柜子和团子都交给你啦，要好好照顾它们哦。
      <div class="sign">—— 奶奶</div>
    </div>
    ${full
      ? `<div class="letter" style="font-size:14px;background:#fff4d6">
          P.S. 你居然把撕掉的三块碎片都找回来了！<br>
          那是我故意藏起来的：闹钟背后、茶杯底下、还有团子的肚皮下面。<br>
          其实我没有去旅行——我就在门外，等你转过身来。🌈
        </div>`
      : `<p class="sub">照片上缺了三块……好像被人故意撕下来，藏在了柜子周围。（🧩 ${nShard}/3）</p>`}
    <div class="stats">
      <div>用时<b>${fmtTime(S.time)}</b></div>
      <div>使用提示<b>${S.hints} 次</b></div>
      <div>碎片<b>🧩 ${nShard}/3</b></div>
      <div>评价<b style="color:#e0a21b">${stars}</b></div>
    </div>
    <div class="row"><button class="btn" id="stay">再看看柜子</button><button class="btn primary" id="again">再玩一次</button></div>
  `);
  s.querySelector('#stay').onclick = closeModal;
  s.querySelector('#again').onclick = restart;
  updateHud();
}
function restart() {
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}
$('#btnReset').addEventListener('click', () => {
  if (confirm('确定要重新开始吗？当前进度会被清空。')) restart();
});

/* =========================================================
 * 拾取 / 悬停 / 点击
 * ======================================================= */
const raycaster = new THREE.Raycaster();
raycaster.layers.enable(1);
const ndc = new THREE.Vector2();
const tipEl = $('#tip');
const isShown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
function pick(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(world, true).find(h => isShown(h.object));
  for (let o = hit?.object; o; o = o.parent) if (o.userData.info) return o;
  return null; // 被柜门等遮挡时不会穿透选中
}
// 手指比鼠标粗：正中点不中时，在周围一圈再找找
function pickNear(cx, cy) {
  const o = pick(cx, cy);
  if (o) return o;
  for (const r of [10, 20]) for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2, h = pick(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    if (h) return h;
  }
  return null;
}
const tipText = info => (selected ? `对「${info.name}」使用 ${ITEMS[selected].icon}` : info.tip ? info.tip() : info.name);

let hovered = null;
function setHover(o) {
  if (hovered === o) return;
  if (hovered) hovered.userData.info.outlines.forEach(m => { m.uniforms.color.value.set(INK); m.uniforms.thickness.value = LINE; });
  hovered = o;
  if (o) o.userData.info.outlines.forEach(m => { m.uniforms.color.value.set(HILITE); m.uniforms.thickness.value = LINE_HOVER; });
  renderer.domElement.style.cursor = o ? 'pointer' : 'grab';
  if (o) {
    tipEl.textContent = tipText(o.userData.info);
    tipEl.classList.add('show');
  } else tipEl.classList.remove('show');
}

let down = null;
const el = renderer.domElement;
el.style.cursor = 'grab';
const touches = new Set();
el.addEventListener('pointerdown', e => {
  touches.add(e.pointerId);
  down = touches.size > 1 ? null : { x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse' };
});
el.addEventListener('pointercancel', e => { touches.delete(e.pointerId); down = null; });
el.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  tipEl.style.left = e.clientX + 16 + 'px';
  tipEl.style.top = e.clientY + 14 + 'px';
  if (e.buttons) return setHover(null);
  setHover(pick(e.clientX, e.clientY));
});
el.addEventListener('pointerleave', () => setHover(null));
el.addEventListener('pointerup', e => {
  touches.delete(e.pointerId);
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const touch = down.touch;
  down = null;
  if (moved > (touch ? 12 : 6)) return;
  const o = touch ? pickNear(e.clientX, e.clientY) : pick(e.clientX, e.clientY);
  if (o) activate(o);
  else if (selected) select(null);
});

function activate(o) {
  const info = o.userData.info;
  audio();
  if (selected) {
    const it = ITEMS[selected];
    if (!info.onUse?.(selected)) {
      tone(200, 0.15, { type: 'triangle', vol: 0.1 });
      say(it.icon + ' ' + it.name, `在「${info.name}」上好像用不上……`);
    }
  } else {
    const handled = info.onClick();
    if (!handled && info.desc) say(info.name, typeof info.desc === 'function' ? info.desc() : info.desc);
  }
  if (hovered === o) tipEl.textContent = tipText(info);
}

/* ---------- 工具栏 ---------- */
document.getElementById('btnView').addEventListener('click', () => {
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  tween(0.9, p => { camera.position.lerpVectors(p0, HOME, p); controls.target.lerpVectors(t0, TARGET, p); }, { id: 'cam' });
});
const btnSound = document.getElementById('btnSound');
btnSound.addEventListener('click', () => {
  muted = !muted;
  btnSound.firstChild.textContent = muted ? '🔇' : '🔊';
  if (muted) stopNoise();
});

/* ---------- 背景音乐：自动生成的摇篮曲 ---------- */
const bgm = { on: localStorage.getItem('cabinet-bgm') !== 'off', gain: null, next: 0, step: 0, timer: null };
const btnMusic = document.getElementById('btnMusic');
const syncMusicBtn = () => (btnMusic.style.opacity = bgm.on ? 1 : 0.45);
syncMusicBtn();
const CHORDS = [[262, 330, 392], [220, 262, 330], [175, 220, 262], [196, 247, 294]]; // C Am F G
const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
function startBgm() {
  if (bgm.timer) return;
  const a = audio();
  bgm.gain = a.createGain();
  bgm.gain.gain.value = 0;
  bgm.gain.connect(a.destination);
  bgm.next = a.currentTime + 0.1;
  const STEP = 0.36;
  const note = (f, t, dur, vol, type) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(bgm.gain);
    o.start(t); o.stop(t + dur + 0.05);
  };
  bgm.timer = setInterval(() => {
    const want = bgm.on && !muted && !music.on && !noise ? 1 : 0;
    bgm.gain.gain.setTargetAtTime(want * 0.5, a.currentTime, 0.4);
    if (bgm.next < a.currentTime) bgm.next = a.currentTime + 0.05; // 标签页切回来时不补播
    while (bgm.next < a.currentTime + 0.5) {
      const bar = Math.floor(bgm.step / 8) % 4, i = bgm.step % 8, ch = CHORDS[bar];
      note(ch[ARP[i]] * 2, bgm.next, 0.9, 0.05, 'sine');
      if (i === 0) note(ch[0] / 2, bgm.next, 2.6, 0.06, 'triangle');
      if (i === 4 && Math.random() < 0.35) note(ch[2] * 4, bgm.next + 0.18, 0.5, 0.012, 'sine');
      bgm.next += STEP;
      bgm.step++;
    }
  }, 120);
}
addEventListener('pointerdown', () => startBgm(), { once: true });
btnMusic.addEventListener('click', () => {
  bgm.on = !bgm.on;
  localStorage.setItem('cabinet-bgm', bgm.on ? 'on' : 'off');
  syncMusicBtn();
  startBgm();
  showToast(bgm.on ? '🎵 背景音乐：开' : '🎵 背景音乐：关');
});

/* =========================================================
 * 读档：恢复场景状态
 * ======================================================= */
function applyState() {
  if (S.gotKey) clockState.h = clockState.m = 0;
  if (S.doorsUnlocked) { padlock.visible = false; doors.forEach(d => setDoor(d, true, true)); }
  if (S.gotBulb) jarBulb.visible = false;
  if (S.lampFixed) { lampBulb.visible = true; setLamp(true, true); }
  if (S.drawerUnlocked) { comboLock.visible = false; setDrawer(true, true); }
  if (S.radioTuned) radioState.freq = FM_TARGET;
  if (S.catFed) { cat.position.x = CAT_X1; musicBox.visible = true; }
  if (S.boxOpen) boxLid.rotation.x = -1.9;
  if (S.gotMagnet) magnet.visible = false;
  if (S.gotYarn) yarn.userData.note.visible = false;
  if (S.gotNoteB) mailPaper.visible = false;
  if (S.shards.clock) clockShard.visible = false;
  setTeaLevel(S.sips);
  updateHud();
  updateInv();
}
applyState();

/* =========================================================
 * 主循环
 * ======================================================= */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  // 窄屏时加大视角，保证柜子（含打开的门）横向放得下
  const need = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(15)) / camera.aspect);
  camera.fov = Math.max(32, THREE.MathUtils.radToDeg(need));
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);
onResize();

// 入场：柜子从天而降
cab.position.y = 4;
tween(1.1, p => (cab.position.y = 4 * (1 - p)), { ease: ease.bounce, delay: 0.25 });
document.getElementById('loading').classList.add('hide');
setTimeout(() => {
  if (!S.introSeen) openLetter();
  else if (S.done) say('欢迎回来', '奶奶的礼物已经找到啦。点八音盒可以重温结局，点「重来」可以再玩一次。');
  else say('欢迎回来', '进度已自动保存。卡住了可以点右上角的「💡 提示」。');
}, 1500);

const clk = new THREE.Clock();
let frameNo = 0;
const headV = new THREE.Vector3();
function loop() {
  const dt = Math.min(clk.getDelta(), 0.05);
  const t = clk.elapsedTime;
  updateTweens(dt);
  updateFx(dt);

  // 闹钟：解开前停在玩家拨的时间，解开后走真实时间
  let h, m;
  if (S.gotKey) {
    const now = new Date();
    m = now.getMinutes() + now.getSeconds() / 60;
    h = (now.getHours() % 12) + m / 60;
  } else { h = clockState.h; m = clockState.m; }
  hourHand.rotation.z = -(h / 12) * Math.PI * 2 - clockState.spin;
  minHand.rotation.z = -(m / 60) * Math.PI * 2 - clockState.spin * 12;

  // 地球仪
  globeSpin.rotation.y += globeState.v * dt;
  globeState.v = 0.25 + (globeState.v - 0.25) * Math.exp(-1.2 * dt);

  // 收音机：指针跟随频率，放歌时跳动
  needle.position.x = needleX(radioState.freq);
  if (music.on === 'radio') {
    const b = Math.abs(Math.sin(t * Math.PI / music.beat));
    radioBody.scale.set(1 + b * 0.025, 1 - b * 0.04 + 0.02, 1);
  } else radioBody.scale.lerp(tmpV.set(1, 1, 1), 0.2);

  // 猫：呼吸 + 摇尾巴 + Zzz
  catTail.rotation.y = Math.sin(t * 1.3) * 0.08;
  if (!catState.awake) {
    catBody.scale.y = 1 + Math.sin(t * 2.2) * 0.04;
    catState.zTimer -= dt;
    if (drawer.userData.open && catState.zTimer <= 0) {
      catState.zTimer = 1.4;
      spawnText(Math.random() > 0.5 ? 'Z' : 'z', '#98c1d9', worldPos(catHead, 0.22).add(tmpV.set(0.08, 0, 0)), { size: 0.2, rise: 0.55, drift: 0.3, life: 2 });
    }
  }

  // 猫的对话气泡跟随头部
  if (bubble.classList.contains('show')) {
    catHead.getWorldPosition(headV).y += 0.3;
    headV.project(camera);
    bubble.style.left = (headV.x * 0.5 + 0.5) * innerWidth + 'px';
    bubble.style.top = (-headV.y * 0.5 + 0.5) * innerHeight + 'px';
  }

  // 视角谜题：镜头接近 VIEW_SPOT 时涂鸦逐渐发光
  if (frameNo++ % 15 === 0) renderProjDepth();
  doodleMat.uniforms.time.value = t;
  if (!S.sawFreq) {
    const a = tmpV.copy(camera.position).sub(TARGET), b = headV.copy(VIEW_SPOT).sub(TARGET);
    const ang = a.angleTo(b), dr = Math.abs(a.length() - b.length());
    doodleMat.uniforms.glow.value = ang < 0.35 ? (1 - ang / 0.35) * 0.6 : 0;
    // 没拼好纸条：完全看不见；拼好后远离正确角度时只是淡淡的划痕
    const near = 1 - THREE.MathUtils.smoothstep(ang, 0.12, 0.6);
    const want = S.noteFull ? 0.12 + 0.88 * near : 0;
    doodleMat.uniforms.alpha.value += (want - doodleMat.uniforms.alpha.value) * Math.min(1, dt * 4);
    if (ang < 0.11 && dr < 1.6 && S.noteFull && !modal.classList.contains('show')) {
      viewHold += dt;
      if (viewHold > 0.5) sawDoodle();
    } else viewHold = 0;
  } else { doodleMat.uniforms.glow.value = 1; doodleMat.uniforms.alpha.value = 1; }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

</script>
