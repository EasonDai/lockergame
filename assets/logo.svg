<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 炊烟 -->
  <g fill="#fffaf1" stroke="#3d3030" stroke-width="3.5">
    <circle cx="96" cy="12" r="5"/>
    <circle cx="104" cy="6" r="3.5"/>
  </g>
  <!-- 烟囱 -->
  <rect x="84" y="20" width="16" height="30" rx="2" fill="#b56576" stroke="#3d3030" stroke-width="5" stroke-linejoin="round"/>
  <!-- 团子：从屋脊后面探出头 -->
  <g stroke="#3d3030" stroke-width="4.5" stroke-linejoin="round">
    <path d="M27 28 l1 -15 l11 8 z" fill="#f0a35e"/>
    <path d="M45 20 l11 -7 l0 15 z" fill="#f0a35e"/>
    <ellipse cx="42" cy="31" rx="15" ry="12" fill="#f0a35e"/>
  </g>
  <path d="M34 29 q3 -3 6 0 M44 29 q3 -3 6 0" fill="none" stroke="#3d3030" stroke-width="3" stroke-linecap="round"/>
  <!-- 墙 -->
  <rect x="22" y="60" width="84" height="56" rx="6" fill="#fdf0dc" stroke="#3d3030" stroke-width="6"/>
  <!-- 屋顶 -->
  <path d="M8 66 L64 22 L120 66 Q122 72 115 72 L13 72 Q6 72 8 66 Z" fill="#e07a5f" stroke="#3d3030" stroke-width="6" stroke-linejoin="round"/>
  <path d="M40 54 h48 M52 44 h24" stroke="#3d3030" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  <!-- 窗户 -->
  <g fill="#f2cc8f" stroke="#3d3030" stroke-width="4">
    <rect x="30" y="80" width="18" height="16" rx="3"/>
    <rect x="80" y="80" width="18" height="16" rx="3"/>
  </g>
  <path d="M39 80 v16 M30 88 h18 M89 80 v16 M80 88 h18" stroke="#3d3030" stroke-width="3"/>
  <!-- 门：奶奶柜子的薄荷绿 -->
  <path d="M52 116 V92 a12 12 0 0 1 24 0 V116 Z" fill="#7fb7a4" stroke="#3d3030" stroke-width="5" stroke-linejoin="round"/>
  <path d="M64 101 c-6.5 -4.3 -7.2 -10 -3.3 -11.5 c1.9 -.7 3.3 .7 3.3 2.2 c0 -1.5 1.4 -2.9 3.3 -2.2 c3.9 1.5 3.2 7.2 -3.3 11.5z" fill="#e07a5f" stroke="#3d3030" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="71" cy="106" r="2.5" fill="#f2cc8f" stroke="#3d3030" stroke-width="2"/>
  <!-- 台阶 -->
  <rect x="44" y="114" width="40" height="8" rx="3" fill="#c9b79c" stroke="#3d3030" stroke-width="4.5"/>
</svg>
