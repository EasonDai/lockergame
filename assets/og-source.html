<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<!-- OG 分享图源文件：用 Chrome 无头模式截图成 og-image.png（1200×630），见 README -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #3d3030;
    background: radial-gradient(ellipse at 30% 45%, #fdf6ea 0%, #f4ead8 55%, #ebdcc3 100%); position: relative; }
  .frame { position: absolute; inset: 26px; border: 6px solid #3d3030; border-radius: 36px; }
  .dot { position: absolute; border: 4px solid #3d3030; border-radius: 50%; }
  .logo { position: absolute; left: 92px; top: 105px; width: 420px; height: 420px; }
  .shadow { position: absolute; left: 140px; top: 498px; width: 330px; height: 34px; border-radius: 50%; background: rgba(61,48,48,.12); }
  .txt { position: absolute; left: 548px; top: 150px; }
  .tag { display: inline-block; background: #e07a5f; color: #fff; font-weight: 800; font-size: 26px; padding: 6px 18px; border: 4px solid #3d3030; border-radius: 14px;
    box-shadow: 4px 4px 0 #3d3030; transform: rotate(-3deg); }
  h1 { font-size: 80px; font-weight: 900; letter-spacing: 4px; margin-top: 22px; line-height: 1.05; }
  h2 { font-size: 40px; font-weight: 800; color: #5f9a86; margin-top: 12px; letter-spacing: 4px; }
  h2 span { color: #3d3030; opacity: .35; margin: 0 6px; }
  p { font-size: 25px; margin-top: 28px; opacity: .72; letter-spacing: 1px; }
  .icons { position: absolute; font-size: 40px; }
</style></head><body>
  <div class="frame"></div>
  <div class="dot" style="width:54px;height:54px;left:1060px;top:70px;background:#f2cc8f"></div>
  <div class="dot" style="width:26px;height:26px;left:1110px;top:150px;background:#98c1d9"></div>
  <div class="dot" style="width:30px;height:30px;left:70px;top:70px;background:#f4a6b8"></div>
  <div class="dot" style="width:20px;height:20px;left:500px;top:90px;background:#7fb7a4"></div>
  <div class="icons" style="left:1070px;top:530px;font-size:34px;transform:rotate(12deg)">🗝️</div>
  <div class="icons" style="left:470px;top:440px;font-size:34px">🎵</div>
  <div class="icons" style="left:1000px;top:540px;font-size:28px">🌙</div>
  <div class="shadow"></div>
  <img class="logo" src="logo.svg">
  <div class="txt">
    <div class="tag">3D 解谜</div>
    <h1>爷爷奶奶的旧屋</h1>
    <h2>奶奶的柜子<span>·</span>爷爷的书桌</h2>
    <p>藏在旧屋里的礼物与心意 · 打开浏览器就能玩</p>
  </div>
</body></html>
